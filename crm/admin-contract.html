<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contract Generator | CRM Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans p-6 min-h-screen">
    
    <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
        <div class="bg-slate-800 p-6 text-white">
            <h1 class="text-2xl font-bold">Generate Service Agreement</h1>
            <p class="text-sm text-slate-300 mt-1">Draft a new contract and email the secure link to the client.</p>
        </div>

        <form id="contract-form" class="p-6 md:p-8 space-y-6">
            <!-- Client Details -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Client Name / Company</label>
                    <input type="text" id="client-name" required class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-slate-800">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Client Email</label>
                    <input type="email" id="client-email" required class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-slate-800">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Client Address</label>
                    <input type="text" id="client-address" required placeholder="123 Example Street, City, State" class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-slate-800">
                </div>
            </div>

            <hr class="border-gray-200">

            <!-- Service Details -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Schedule of Services (Inclusions)</label>
                <textarea id="inclusions" rows="3" required placeholder="e.g., 4x 1-hour coaching sessions, Portal Access" class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-slate-800"></textarea>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Total Fee ($)</label>
                    <input type="number" id="total-fee" required placeholder="1500" class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-slate-800">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Payment Structure</label>
                    <select id="payment-structure" class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-slate-800 bg-white">
                        <option value="100% Upfront">100% Upfront</option>
                        <option value="50% Deposit & 50% Upon Delivery">50/50 Split</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Target Delivery Date</label>
                    <input type="date" id="target-date" required class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-slate-800">
                </div>
            </div>

            <button type="submit" id="submit-btn" class="w-full bg-slate-800 text-white font-bold py-3 px-4 rounded-md hover:bg-slate-900 transition-colors">
                Generate & Send Contract
            </button>
        </form>

        <div id="success-message" class="hidden bg-green-50 text-green-800 p-6 border-t border-green-200 text-center">
            <h3 class="text-lg font-bold mb-2">Contract Sent!</h3>
            <p class="text-sm">The magic link has been emailed to the client and saved to the database.</p>
            <button onclick="location.reload()" class="mt-4 text-sm underline font-medium">Create Another</button>
        </div>
    </div>

    <script>
        document.getElementById('contract-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerText = 'Generating & Sending...';

            const payload = {
                clientName: document.getElementById('client-name').value,
                clientEmail: document.getElementById('client-email').value,
                clientAddress: document.getElementById('client-address').value,
                inclusions: document.getElementById('inclusions').value,
                totalFee: document.getElementById('total-fee').value,
                paymentStructure: document.getElementById('payment-structure').value,
                targetDate: document.getElementById('target-date').value
            };

            try {
                const res = await fetch('/api/generate-contract', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await res.json();

                if (result.success) {
                    document.getElementById('contract-form').classList.add('hidden');
                    document.getElementById('success-message').classList.remove('hidden');
                } else {
                    alert('Failed: ' + (result.error || result.message));
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'Generate & Send Contract';
                }
            } catch (err) {
                console.error(err);
                alert('An error occurred. Please try again.');
                submitBtn.disabled = false;
                submitBtn.innerText = 'Generate & Send Contract';
            }
        });
    </script>
</body>
</html>
