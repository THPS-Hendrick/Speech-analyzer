<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speaker CRM Dashboard</title>
    <!-- Import Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col font-sans">
    
    <!-- Top Navigation -->
    <header class="bg-white shadow px-6 py-4 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-gray-800">Pipeline</h1>
        <button class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 font-medium">
            + New Client
        </button>
    </header>

    <!-- Kanban Board Container -->
    <main class="flex-1 overflow-x-auto overflow-y-hidden p-6 flex space-x-6" id="kanban-board">
        <!-- Columns will go here -->
        
        <!-- Column 1: Enquiry Received -->
<div class="w-80 flex-shrink-0 bg-gray-200 rounded-lg flex flex-col max-h-full">
    <div class="p-3 border-b border-gray-300">
        <h2 class="font-semibold text-gray-700">Enquiry Received</h2>
    </div>
    <div class="flex-1 overflow-y-auto p-3 space-y-3" id="col-enquiry">
    
    <!-- Tags Area -->
    <div class="flex flex-wrap gap-2 mt-3">
        <span class="bg-red-100 text-red-800 text-xs px-2 py-1 rounded-full font-medium">Cold</span>
        <span class="bg-green-100 text-green-800 text-xs px-2 py-1 rounded-full font-medium">Subscribed</span>
    </div>
</div>
    </div>
</div>

<!-- Column 2: Assessment Booked -->
<div class="w-80 flex-shrink-0 bg-gray-200 rounded-lg flex flex-col max-h-full">
    <div class="p-3 border-b border-gray-300">
        <h2 class="font-semibold text-gray-700">Assessment Booked</h2>
    </div>
    <div class="flex-1 overflow-y-auto p-3 space-y-3" id="col-assessment">
    </div>
</div>
        <!-- Column 3: Session 1 Booked -->
<div class="w-80 flex-shrink-0 bg-gray-200 rounded-lg flex flex-col max-h-full">
    <div class="p-3 border-b border-gray-300">
        <h2 class="font-semibold text-gray-700">Session 1 Booked</h2>
    </div>
    <div class="flex-1 overflow-y-auto p-3 space-y-3" id="col-enquiry">
    </div>
</div>

<!-- Column 4: Session 2 -->
<div class="w-80 flex-shrink-0 bg-gray-200 rounded-lg flex flex-col max-h-full">
    <div class="p-3 border-b border-gray-300">
        <h2 class="font-semibold text-gray-700">Session 2 Booked</h2>
    </div>
    <div class="flex-1 overflow-y-auto p-3 space-y-3" id="col-assessment">
    </div>
</div>
          <!-- Column 5: Session 3 Booked -->
<div class="w-80 flex-shrink-0 bg-gray-200 rounded-lg flex flex-col max-h-full">
    <div class="p-3 border-b border-gray-300">
        <h2 class="font-semibold text-gray-700">Session 3 Booked</h2>
    </div>
    <div class="flex-1 overflow-y-auto p-3 space-y-3" id="col-enquiry">
    </div>
</div>

<!-- Column 6: Session 4 -->
<div class="w-80 flex-shrink-0 bg-gray-200 rounded-lg flex flex-col max-h-full">
    <div class="p-3 border-b border-gray-300">
        <h2 class="font-semibold text-gray-700">Session 4 Booked</h2>
    </div>
    <div class="flex-1 overflow-y-auto p-3 space-y-3" id="col-assessment">
    </div>
</div>
        
    </main>

    <!-- Link your JavaScript file -->
    <script type="module" src="https://raw.githack.com/THPS-Hendrick/Speech-analyzer/main/crm/app.js"></script>
</body>
</html>
