<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speaker CRM Dashboard</title>
    <!-- Import Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col font-sans">
    
    <!-- Top Navigation -->
    <header class="bg-white shadow px-6 py-4 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-gray-800">Pipeline</h1>
        <div class="flex items-center gap-4">
            <button id="logout-btn" class="text-gray-500 hover:text-gray-800 text-sm font-medium transition-colors">Log Out</button>
            <button id="new-client-btn" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 font-medium transition-colors shadow-sm">
                + New Client
            </button>
        </div>
    </header>

    <!-- Kanban Board Container (5 Automated & Manual Columns) -->
    <main class="flex-1 overflow-x-auto overflow-y-hidden p-6 flex space-x-6" id="kanban-board">
        
        <!-- Column 1: Enquiry Received -->
        <div class="w-80 flex-shrink-0 bg-gray-200 rounded-lg flex flex-col max-h-full">
            <div class="p-3 border-b border-gray-300">
                <h2 class="font-semibold text-gray-700">Enquiry Received</h2>
            </div>
            <div class="flex-1 overflow-y-auto p-3 space-y-3" id="col-enquiry"></div>
        </div>

        <!-- Column 2: Online Classes -->
        <div class="w-80 flex-shrink-0 bg-gray-200 rounded-lg flex flex-col max-h-full">
            <div class="p-3 border-b border-gray-300">
                <h2 class="font-semibold text-gray-700">Online Classes</h2>
            </div>
            <div class="flex-1 overflow-y-auto p-3 space-y-3" id="col-online-classes"></div>
        </div>

        <!-- Column 3: Active -->
        <div class="w-80 flex-shrink-0 bg-gray-200 rounded-lg flex flex-col max-h-full">
            <div class="p-3 border-b border-gray-300">
                <h2 class="font-semibold text-gray-700">Active</h2>
            </div>
            <div class="flex-1 overflow-y-auto p-3 space-y-3" id="col-active"></div>
        </div>

        <!-- Column 4: Cold (7+ Days Inactive) -->
        <div class="w-80 flex-shrink-0 bg-gray-200 rounded-lg flex flex-col max-h-full">
            <div class="p-3 border-b border-gray-300">
                <h2 class="font-semibold text-gray-700">Cold</h2>
            </div>
            <div class="flex-1 overflow-y-auto p-3 space-y-3" id="col-cold"></div>
        </div>

        <!-- Column 5: Dormant (30+ Days Inactive) -->
        <div class="w-80 flex-shrink-0 bg-gray-200 rounded-lg flex flex-col max-h-full">
            <div class="p-3 border-b border-gray-300">
                <h2 class="font-semibold text-gray-700">Dormant</h2>
            </div>
            <div class="flex-1 overflow-y-auto p-3 space-y-3" id="col-dormant"></div>
        </div>
        
    </main>

    <!-- CLIENT FOCUS MODAL (Activity Log, Routing & Billing) -->
    <div id="client-focus-modal" class="hidden fixed inset-0 bg-black bg-opacity-60 flex justify-center items-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-5xl h-[85vh] flex flex-col overflow-hidden">
            
            <!-- Header -->
            <div class="bg-slate-800 px-6 py-4 flex justify-between items-center text-white">
                <div>
                    <h2 id="focus-name" class="font-bold text-xl">Client Name</h2>
                    <p id="focus-email" class="text-sm text-slate-300 mt-1">client@email.com</p>
                </div>
                <button id="close-focus-modal" class="text-slate-300 hover:text-white text-3xl leading-none">&times;</button>
            </div>
            
            <!-- Two-Pane Layout -->
            <div class="flex flex-1 overflow-hidden flex-col md:flex-row">
                
                <!-- Left: Scrollable Activity Log -->
                <div class="w-full md:w-3/5 border-r border-gray-200 p-6 overflow-y-auto bg-gray-50 flex flex-col gap-4" id="focus-activity-log">
                    <!-- Javascript will inject timestamped log bubbles here -->
                </div>
                
                <!-- Right: Actions & Kanban Routing -->
                <div class="w-full md:w-2/5 p-6 space-y-6 bg-white overflow-y-auto flex flex-col">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Move Pipeline Stage</label>
                        <select id="focus-stage-select" class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-600 bg-gray-50 cursor-pointer text-slate-800 font-medium">
                            <option value="Enquiry Received">Enquiry Received</option>
                            <option value="Online Classes">Online Classes</option>
                            <option value="Active">Active</option>
                            <option value="Cold">Cold</option>
                            <option value="Dormant">Dormant</option>
                        </select>
                    </div>
                    
                    <div class="border-t border-gray-200 pt-6 flex-grow">
                        <h3 class="text-sm font-bold text-gray-700 mb-3 uppercase tracking-wider">Client Actions</h3>

                        <!-- Dynamic Drive Toggle Button (Generate Drive / Go to Drive) -->
                        <button id="btn-drive-toggle" type="button" class="w-full mb-3 border-2 border-blue-600 text-blue-600 font-bold py-3 px-4 rounded-md hover:bg-blue-50 transition-colors flex justify-center items-center">
                            Generate Drive
                        </button>
                        
                        <!-- Path A: Full Contract -->
                        <button id="btn-full-contract" type="button" class="w-full mb-3 bg-slate-800 text-white font-bold py-3 px-4 rounded-md shadow-sm hover:bg-slate-900 transition-colors">
                            Generate Full Contract
                        </button>

                        <!-- Path B: Quick Invoice -->
                        <button id="btn-quick-invoice-toggle" type="button" class="w-full mb-3 bg-green-600 text-white font-bold py-3 px-4 rounded-md shadow-sm hover:bg-green-700 transition-colors">
                            Quick Invoice (No Contract)
                        </button>

                        <!-- The Hidden Mini-Form -->
                        <form id="quick-invoice-form" class="hidden bg-gray-50 border border-gray-200 rounded-md p-4 mb-3 space-y-3">
                            <div>
                                <label class="block text-xs font-bold text-gray-700 mb-1">Service Description</label>
                                <input type="text" id="qi-desc" required placeholder="e.g., 1x Ad-hoc Coaching" class="w-full p-2 border border-gray-300 rounded text-sm focus:ring-2 focus:ring-green-600 outline-none">
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs font-bold text-gray-700 mb-1">Units (Hrs/Qty)</label>
                                    <input type="number" id="qi-units" required min="1" value="1" class="w-full p-2 border border-gray-300 rounded text-sm focus:ring-2 focus:ring-green-600 outline-none">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-gray-700 mb-1">Rate ($)</label>
                                    <input type="number" id="qi-rate" required min="0" step="0.01" class="w-full p-2 border border-gray-300 rounded text-sm focus:ring-2 focus:ring-green-600 outline-none">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-700 mb-1">Fixed Discount ($)</label>
                                <input type="number" id="qi-discount" min="0" step="0.01" value="0" class="w-full p-2 border border-gray-300 rounded text-sm focus:ring-2 focus:ring-green-600 outline-none">
                            </div>
                            <div class="mt-2">
                                <label class="block text-xs font-bold text-gray-700 mb-1">GST Configuration</label>
                                <select id="qi-gst-mode" class="w-full p-2 border border-gray-300 rounded text-sm focus:ring-2 focus:ring-green-600 outline-none bg-white">
                                    <option value="inclusive" selected>GST Included (Inclusive)</option>
                                    <option value="exclusive">Apply 10% GST (Exclusive)</option>
                                    <option value="none">No GST</option>
                                </select>
                            </div>
                            <button type="submit" id="qi-submit" class="w-full bg-green-700 text-white font-bold py-3 rounded shadow hover:bg-green-800 transition-colors mt-2 text-sm">Generate PDF Invoice</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- NEW CLIENT MODAL POPUP -->
    <div id="new-client-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50 p-4">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md overflow-hidden">
            <div class="bg-slate-800 px-6 py-4 flex justify-between items-center">
                <h2 class="text-white font-bold text-lg">Add New Client</h2>
                <button type="button" id="close-modal-x" class="text-slate-300 hover:text-white text-2xl leading-none">&times;</button>
            </div>
            <form id="new-client-form" class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Client Name</label>
                    <input type="text" id="modal-name" required class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-600">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="modal-email" required class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-600">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Source / Tags (e.g., Website, Cold)</label>
                    <input type="text" id="modal-source" required class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-600">
                </div>
                <div class="flex justify-end space-x-3 pt-4 border-t border-gray-200">
                    <button type="button" id="cancel-modal-btn" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded font-medium transition-colors">Cancel</button>
                    <button type="submit" id="save-client-btn" class="bg-blue-600 text-white px-6 py-2 rounded shadow hover:bg-blue-700 font-medium transition-colors">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Link your JavaScript file -->
    <script type="module" src="app.js"></script>
</body>
</html>
