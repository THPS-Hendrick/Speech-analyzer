<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speaker CRM Dashboard</title>
    <!-- Import Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col font-sans">
    
    <!-- Top Navigation -->
    <header class="bg-white shadow px-6 py-4 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-gray-800">Pipeline</h1>
        <button class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 font-medium">
            + New Client
        </button>
    </header>

    <!-- Kanban Board Container -->
    <main class="flex-1 overflow-x-auto overflow-y-hidden p-6 flex space-x-6" id="kanban-board">
        <!-- Columns will go here -->
    </main>

    <!-- Link your JavaScript file -->
    <script src="app.js"></script>
</body>
</html>
