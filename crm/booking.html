<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book your Assessment</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans p-4 md:p-8 flex items-start justify-center min-h-screen">
    
    <!-- Main Card Container -->
    <div class="w-full max-w-4xl bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col md:flex-row">
        
        <!-- Left Info Panel -->
        <div class="bg-blue-50 p-6 md:p-8 md:w-1/3 border-b md:border-b-0 md:border-r border-gray-200">
            <h2 class="text-xs font-bold text-blue-600 uppercase tracking-wider mb-2">Tom Hendrick</h2>
            <h1 class="text-2xl font-bold text-gray-900 mb-4">Public Speaking Assessment</h1>
            <div class="text-gray-600 mb-3 flex items-center text-sm font-medium">
                <svg class="w-5 h-5 mr-2 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                1 Hour
            </div>
            <div class="text-gray-600 flex items-center text-sm font-medium">
                <svg class="w-5 h-5 mr-2 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                Google Meet
            </div>
        </div>

        <!-- Right Booking Panel -->
        <div class="p-6 md:p-8 md:w-2/3">
            <h3 class="text-lg font-bold text-gray-800 mb-4">Select a Date & Time</h3>
            
            <!-- Mock Dates (Will be populated by Vercel later) -->
            <div class="grid grid-cols-3 gap-3 mb-6" id="date-grid">
                <button class="border-2 border-blue-600 bg-blue-50 text-blue-800 rounded-lg p-2 md:p-3 text-center text-sm font-medium cursor-pointer">Mon<br>Sep 21</button>
                <button class="border border-gray-200 hover:border-blue-600 hover:bg-blue-50 rounded-lg p-2 md:p-3 text-center text-sm font-medium transition-colors">Tue<br>Sep 22</button>
                <button class="border border-gray-200 hover:border-blue-600 hover:bg-blue-50 rounded-lg p-2 md:p-3 text-center text-sm font-medium transition-colors">Wed<br>Sep 23</button>
            </div>

            <!-- Mock Times -->
            <h3 class="text-sm font-semibold text-gray-600 mb-3 uppercase tracking-wide">Available Times for Mon, Sep 21</h3>
            <div class="grid grid-cols-2 gap-3 mb-6" id="time-grid">
                <button class="border border-gray-200 py-2 rounded hover:border-blue-600 hover:text-blue-600 font-medium transition-colors text-sm">9:00 AM</button>
                <button class="border border-gray-200 py-2 rounded hover:border-blue-600 hover:text-blue-600 font-medium transition-colors text-sm">11:00 AM</button>
                <button class="border border-gray-200 py-2 rounded hover:border-blue-600 hover:text-blue-600 font-medium transition-colors text-sm">1:30 PM</button>
                <button class="border border-gray-200 py-2 rounded hover:border-blue-600 hover:text-blue-600 font-medium transition-colors text-sm">3:00 PM</button>
            </div>

            <!-- Hidden Form (Shows when a time is clicked) -->
            <div id="booking-form" class="hidden bg-gray-50 p-5 rounded-lg border border-gray-200">
                <h3 class="font-bold text-gray-800 mb-4">Confirm Details</h3>
                <input type="text" id="client-name" placeholder="Full Name" class="w-full mb-3 p-2 border border-gray-300 rounded focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600">
                <input type="email" id="client-email" placeholder="Email Address" class="w-full mb-4 p-2 border border-gray-300 rounded focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600">
                <button class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-md hover:bg-blue-700 transition-colors shadow-sm">Confirm Booking</button>
            </div>

        </div>
    </div>

    <script>
        // UI Logic: Highlight selected time and show the form
        const timeButtons = document.querySelectorAll('#time-grid button');
        const form = document.getElementById('booking-form');

        timeButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                // Remove highlight from all buttons
                timeButtons.forEach(b => {
                    b.classList.remove('bg-blue-600', 'text-white', 'border-blue-600');
                    b.classList.add('border-gray-200', 'text-gray-700');
                });
                
                // Add highlight to the clicked button
                btn.classList.remove('border-gray-200', 'text-gray-700');
                btn.classList.add('bg-blue-600', 'text-white', 'border-blue-600');
                
                // Reveal the name/email form
                form.classList.remove('hidden');
            });
        });
    </script>
</body>
</html>
