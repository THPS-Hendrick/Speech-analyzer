        const WIZARD_STEPS = [
            { step: 1, short: "Challenges", label: "1. Challenges & Opportunities" },
            { step: 2, short: "Nerves", label: "2. Nerve Assessment" },
            { step: 3, short: "Vocal Inhibition", label: "3. Vocal Inhibition Test" },
            { step: 4, short: "Phantasia", label: "4. Phantasia Test" },
            { step: 5, short: "Image Prompt 1", label: "5. Image Prompt #1 (House)" },
            { step: 6, short: "Image Prompt 2", label: "6. Image Prompt #2 (Blank)" },
            { step: 7, short: "Rules 1/6", label: "7. Rule Prompts (1 of 6)" },
            { step: 8, short: "Rules 2/6", label: "8. Rule Prompts (2 of 6)" },
            { step: 9, short: "Rules 3/6", label: "9. Rule Prompts (3 of 6)" },
            { step: 10, short: "Rules 4/6", label: "10. Rule Prompts (4 of 6)" },
            { step: 11, short: "Rules 5/6", label: "11. Rule Prompts (5 of 6)" },
            { step: 12, short: "Rules 6/6", label: "12. Rule Prompts (6 of 6)" },
            { step: 13, short: "Results & Drive", label: "13. Assessment Results" },
            { step: 14, short: "Sales Options", label: "14. Sales Packages" },
            { step: 15, short: "Batch Booking", label: "15. Batch Session Booking" }
        ];

        // ==========================================
        // STATE MODEL (Unified & Hydration-Ready)
        // ==========================================
        const urlParams = new URLSearchParams(window.location.search);
        let currentUser = null;
        let currentStep = 1;
        let activeRecordingContext = null; // { type: 'vocal_demo' | 'vocal_client' | 'image1' | 'image2' }
        let uiTimerInterval = null;
        let activeTimelineTab = "client"; // 'demo' | 'client'

        const state = {
            schemaVersion: "thps-onboarding-v1",
            updatedAt: new Date().toISOString(),
            client: {
                name: urlParams.get("name") || "",
                email: (urlParams.get("email") || "").toLowerCase(),
                driveFolderUrl: "",
                driveFolderId: ""
            },
            challenges: {
                selectedPills: [],
                notes: ""
            },
            nerves: {
                q1: { score: 5, notes: "" },
                q2: { score: 5, notes: "" },
                q3: { score: 5, notes: "" },
                q4: { score: 5, notes: "" }
            },
            vocalInhibition: {
                achievedLevels: { 1: false, 2: false, 3: false, 4: false, 5: false },
                notes: "",
                demoPayload: null,
                clientPayload: null
            },
            phantasia: {
                score: 55,
                type: "Phantasia",
                notes: ""
            },
            imagePrompt1: {
                time: 0,
                wpm: 0,
                visual: 0,
                recorded: false,
                transcript: "",
                notes: ""
            },
            imagePrompt2: {
                time: 0,
                wpm: 0,
                visual: 0,
                recorded: false,
                transcript: "",
                notes: ""
            },
            rulePrompts: RULE_PROMPT_ROUNDS.reduce((acc, r) => {
                acc[`round${r.round}`] = {
                    round: r.round,
                    title: r.title,
                    notes: "",
                    items: r.questions.map((q, idx) => ({
                        index: idx + 1,
                        question: q,
                        correct: false,
                        noDelay: false,
                        voice: false
                    }))
                };
                return acc;
            }, {}),
            batchSessions: [
                { title: "", date: "", time: "10:00", durationMinutes: 60 }
            ]
        };

        // ==========================================
        // HELPERS
        // ==========================================
        function escapeHtml(str) {
            return String(str ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function showToast(msg, isError = false) {
            const toast = document.getElementById("global-toast");
            toast.innerText = msg;
            toast.className = isError
                ? "text-xs font-semibold px-3 py-1.5 rounded-full bg-rose-900/90 text-rose-100 border border-rose-600"
                : "text-xs font-semibold px-3 py-1.5 rounded-full bg-emerald-900/90 text-emerald-100 border border-emerald-600";
            toast.classList.remove("hidden");
            clearTimeout(toast._hideTimer);
            toast._hideTimer = setTimeout(() => toast.classList.add("hidden"), 4000);
        }

        function getNerveColorMeta(score) {
            const n = Number(score);
            if (n <= 2) return { bg: "bg-purple-600", text: "text-white", border: "border-purple-600", badge: "bg-purple-100 text-purple-800" };
            if (n <= 4) return { bg: "bg-blue-600", text: "text-white", border: "border-blue-600", badge: "bg-blue-100 text-blue-800" };
            if (n <= 6) return { bg: "bg-yellow-400", text: "text-slate-900", border: "border-yellow-500", badge: "bg-yellow-100 text-yellow-900" };
            if (n <= 8) return { bg: "bg-orange-500", text: "text-white", border: "border-orange-500", badge: "bg-orange-100 text-orange-800" };
            return { bg: "bg-red-600", text: "text-white", border: "border-red-600", badge: "bg-red-100 text-red-800" };
        }

        function getPhantasiaBand(val) {
            const n = Math.max(0, Math.min(100, Number(val) || 0));
            if (n <= 9) return { label: "Aphantasia", range: "0–9", color: "text-purple-700 bg-purple-100 border-purple-200", desc: "Unable to voluntarily visualize mental images." };
            if (n <= 49) return { label: "Hypophantasia", range: "10–49", color: "text-blue-700 bg-blue-100 border-blue-200", desc: "Dim, fleeting, or effortful mental imagery." };
            if (n <= 79) return { label: "Phantasia", range: "50–79", color: "text-emerald-700 bg-emerald-100 border-emerald-200", desc: "Clear, compliant mental imagery on demand." };
            return { label: "Hyperphantasia", range: "80–100", color: "text-amber-800 bg-amber-100 border-amber-200", desc: "Vivid, effortless, and involuntary mental imagery." };
        }

        function buildExportPayload() {
            state.updatedAt = new Date().toISOString();
            const totalNerves = ["q1", "q2", "q3", "q4"].reduce((sum, k) => sum + (Number(state.nerves[k]?.score) || 0), 0);

            let rulesCorrect = 0, rulesNoDelay = 0, rulesVoice = 0;
            Object.values(state.rulePrompts).forEach(r => {
                (r.items || []).forEach(it => {
                    if (it.correct) rulesCorrect++;
                    if (it.noDelay) rulesNoDelay++;
                    if (it.voice) rulesVoice++;
                });
            });

            return {
                ...state,
                computedSummary: {
                    totalNervesScore: totalNerves,
                    phantasiaBand: getPhantasiaBand(state.phantasia.score).label,
                    vocalAchievedCount: Object.values(state.vocalInhibition.achievedLevels).filter(Boolean).length,
                    rulesTotals: {
                        correct: rulesCorrect,
                        noDelay: rulesNoDelay,
                        voice: rulesVoice,
                        overall: rulesCorrect + rulesNoDelay + rulesVoice,
                        maxPossible: 90
                    }
                }
            };
        }

        function downloadJsonPayload(stepTag = "") {
            const payload = buildExportPayload();
            const safeClient = (state.client.name || "Client").trim().replace(/[^a-zA-Z0-9_-]/g, "-");
            const datePart = new Date().toISOString().slice(0, 10);
            const suffix = stepTag ? `-${stepTag}` : "";
            const fileName = `${safeClient}-Speech-Assessment${suffix}-${datePart}.json`;

            const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1500);

            showToast(`Saved ${fileName}`);
        }

        function mergeUploadedPayloads(jsonObjects) {
            jsonObjects.forEach((raw) => {
                if (!raw || typeof raw !== "object") return;

                if (raw.client) {
                    if (raw.client.name && !state.client.name) state.client.name = raw.client.name;
                    if (raw.client.email && !state.client.email) state.client.email = raw.client.email;
                    if (raw.client.driveFolderUrl) state.client.driveFolderUrl = raw.client.driveFolderUrl;
                    if (raw.client.driveFolderId) state.client.driveFolderId = raw.client.driveFolderId;
                }
                if (raw.challenges) {
                    if (Array.isArray(raw.challenges.selectedPills)) state.challenges.selectedPills = [...raw.challenges.selectedPills];
                    if (typeof raw.challenges.notes === "string") state.challenges.notes = raw.challenges.notes;
                }
                if (raw.nerves) {
                    ["q1", "q2", "q3", "q4"].forEach(k => {
                        if (raw.nerves[k]) {
                            state.nerves[k] = {
                                score: Number(raw.nerves[k].score) || 5,
                                notes: String(raw.nerves[k].notes || "")
                            };
                        }
                    });
                }
                if (raw.vocalInhibition) {
                    if (raw.vocalInhibition.achievedLevels) {
                        state.vocalInhibition.achievedLevels = { ...state.vocalInhibition.achievedLevels, ...raw.vocalInhibition.achievedLevels };
                    }
                    if (typeof raw.vocalInhibition.notes === "string") state.vocalInhibition.notes = raw.vocalInhibition.notes;
                    if (raw.vocalInhibition.demoPayload) state.vocalInhibition.demoPayload = raw.vocalInhibition.demoPayload;
                    if (raw.vocalInhibition.clientPayload) state.vocalInhibition.clientPayload = raw.vocalInhibition.clientPayload;
                }
                if (raw.phantasia) {
                    if (raw.phantasia.score !== undefined) state.phantasia.score = Number(raw.phantasia.score);
                    state.phantasia.type = getPhantasiaBand(state.phantasia.score).label;
                    if (typeof raw.phantasia.notes === "string") state.phantasia.notes = raw.phantasia.notes;
                }
                if (raw.imagePrompt1) {
                    state.imagePrompt1 = { ...state.imagePrompt1, ...raw.imagePrompt1 };
                }
                if (raw.imagePrompt2) {
                    state.imagePrompt2 = { ...state.imagePrompt2, ...raw.imagePrompt2 };
                }
                if (raw.rulePrompts && typeof raw.rulePrompts === "object") {
                    Object.keys(raw.rulePrompts).forEach(rk => {
                        if (state.rulePrompts[rk] && raw.rulePrompts[rk]) {
                            state.rulePrompts[rk] = {
                                ...state.rulePrompts[rk],
                                ...raw.rulePrompts[rk]
                            };
                        }
                    });
                }
            });
        }

        // ==========================================
        // SPEECH ENGINE TELEMETRY ROUTING
        // ==========================================
        window.addEventListener("thps-dashboard-update", (e) => {
            const payload = e.detail;
            if (!payload || !payload.text || !payload.text.trim()) return;
            if (!activeRecordingContext) return;

            const ctx = activeRecordingContext;
            activeRecordingContext = null;

            if (ctx.type === "vocal_demo") {
                state.vocalInhibition.demoPayload = payload;
                activeTimelineTab = "demo";
                if (currentStep === 3) renderCurrentStep();
                showToast("Tom's demo timeline captured.");
            } else if (ctx.type === "vocal_client") {
                state.vocalInhibition.clientPayload = payload;
                activeTimelineTab = "client";
                if (currentStep === 3) renderCurrentStep();
                showToast("Client attempt timeline captured.");
            } else if (ctx.type === "image1") {
                state.imagePrompt1.time = Math.round(payload.time || 0);
                state.imagePrompt1.wpm = Math.round(payload.wpm || 0);
                state.imagePrompt1.visual = Math.round(payload.visual || 0);
                state.imagePrompt1.recorded = true;
                state.imagePrompt1.transcript = payload.text || "";
                if (currentStep === 5) renderCurrentStep();
                showToast("Image Prompt #1 metrics captured.");
            } else if (ctx.type === "image2") {
                state.imagePrompt2.time = Math.round(payload.time || 0);
                state.imagePrompt2.wpm = Math.round(payload.wpm || 0);
                state.imagePrompt2.visual = Math.round(payload.visual || 0);
                state.imagePrompt2.recorded = true;
                state.imagePrompt2.transcript = payload.text || "";
                if (currentStep === 6) renderCurrentStep();
                showToast("Image Prompt #2 metrics captured.");
            }
        });

        window.addEventListener("thps-recording-error", (e) => {
            activeRecordingContext = null;
            showToast(e.detail?.message || "Microphone error.", true);
        });

        function triggerContextRecording(ctxObj) {
            if (window.thps_isProcessing) return;

            // If currently recording, stop it
            if (window.isActive) {
                if (typeof window.toggleRecording === "function") window.toggleRecording();
                return;
            }

            // Start new recording tagged to ctxObj
            activeRecordingContext = ctxObj;
            if (typeof window.toggleRecording === "function") {
                window.toggleRecording();
            } else {
                alert("Speech engine is still loading. Please try again in a second.");
            }
        }

        // Live 50ms timer update for Vocal & Image steps
        uiTimerInterval = setInterval(() => {
            const isRec = Boolean(window.isActive && window.THPS?.Audio?.recordStartTime);
            const elapsed = isRec ? (Date.now() - window.THPS.Audio.recordStartTime) / 1000 : 0;

            // Step 3 Vocal Timers
            if (currentStep === 3) {
                const demoBtn = document.getElementById("btn-rec-vocal-demo");
                const clientBtn = document.getElementById("btn-rec-vocal-client");
                const timerEl = document.getElementById("vocal-live-timer");

                if (timerEl) {
                    const m = String(Math.floor(elapsed / 60)).padStart(2, "0");
                    const s = String(Math.floor(elapsed % 60)).padStart(2, "0");
                    timerEl.innerText = `${m}:${s}`;
                    timerEl.className = isRec
                        ? "text-2xl font-mono font-black text-rose-600"
                        : "text-2xl font-mono font-black text-slate-800";
                }

                if (demoBtn) {
                    const activeDemo = isRec && activeRecordingContext?.type === "vocal_demo";
                    demoBtn.innerText = activeDemo ? "Stop Tom Demo" : "Record Tom Demo";
                    demoBtn.className = activeDemo
                        ? "px-4 py-2.5 rounded-lg bg-rose-600 text-white font-bold text-xs shadow animate-pulse"
                        : "px-4 py-2.5 rounded-lg bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs shadow";
                }

                if (clientBtn) {
                    const activeClient = isRec && activeRecordingContext?.type === "vocal_client";
                    clientBtn.innerText = activeClient ? "Stop Client Attempt" : "Record Client Attempt";
                    clientBtn.className = activeClient
                        ? "px-4 py-2.5 rounded-lg bg-rose-600 text-white font-bold text-xs shadow animate-pulse"
                        : "px-4 py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs shadow";
                }
            }

            // Steps 5 & 6 Image Prompt 80s Progress Bars (20s = 25%, 60s = 75%)
            if (currentStep === 5 || currentStep === 6) {
                const slotKey = currentStep === 5 ? "image1" : "image2";
                const bar = document.getElementById("img-progress-bar");
                const star20 = document.getElementById("img-star-20");
                const star60 = document.getElementById("img-star-60");
                const recBtn = document.getElementById("btn-img-record");
                const timePill = document.getElementById("pill-img-time");

                const activeHere = isRec && activeRecordingContext?.type === slotKey;
                if (bar) {
                    const pct = activeHere ? Math.min((elapsed / 80) * 100, 100) : 0;
                    bar.style.width = `${pct}%`;
                }
                if (star20) {
                    star20.className = activeHere && elapsed >= 20
                        ? "text-amber-400 font-black text-xs"
                        : "text-slate-400 font-bold text-xs";
                }
                if (star60) {
                    star60.className = activeHere && elapsed >= 60
                        ? "text-amber-400 font-black text-xs"
                        : "text-slate-400 font-bold text-xs";
                }
                if (recBtn) {
                    if (window.thps_isProcessing) {
                        recBtn.innerText = "Analyzing...";
                    } else {
                        recBtn.innerText = activeHere ? "Stop" : "Start";
                    }
                }
                if (timePill && activeHere) {
                    timePill.innerText = `${Math.floor(elapsed)}s TIME`;
                }
            }
        }, 50);

        // ==========================================
        // NAVIGATION & SIDEBAR RENDERING
        // ==========================================
        function renderSidebar() {
            const nav = document.getElementById("wizard-sidebar-nav");
            nav.innerHTML = WIZARD_STEPS.map(s => {
                const active = s.step === currentStep;
                return `
                    <button type="button" data-goto-step="${s.step}" class="w-full text-left px-3 py-2.5 rounded-lg text-xs font-semibold transition-colors flex items-center gap-2.5 ${active ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}">
                        <span class="w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-extrabold flex-shrink-0 ${active ? 'bg-white text-indigo-700' : 'bg-slate-800 text-slate-300'}">${s.step}</span>
                        <span class="hidden md:inline truncate">${escapeHtml(s.short)}</span>
                    </button>
                `;
            }).join("");

            nav.querySelectorAll("[data-goto-step]").forEach(btn => {
                btn.addEventListener("click", () => {
                    goToStep(Number(btn.getAttribute("data-goto-step")));
                });
            });

            document.getElementById("step-counter-badge").innerText = `Step ${currentStep} of 15`;
            document.getElementById("btn-prev-step").disabled = currentStep === 1;
            const nextBtn = document.getElementById("btn-next-step");
            nextBtn.style.display = currentStep === 15 ? "none" : "inline-flex";
        }

        function goToStep(stepNum) {
            if (stepNum < 1 || stepNum > 15) return;
            if (window.isActive && typeof window.toggleRecording === "function") {
                activeRecordingContext = null;
                window.toggleRecording();
            }
            currentStep = stepNum;
            renderSidebar();
            renderCurrentStep();
            document.getElementById("step-scroll-area").scrollTop = 0;
        }

        // ==========================================
        // STEP 1–15 RENDERERS
        // ==========================================

            const mount = document.getElementById("step-mount");

            // ------------------------------------------
            // STEP 1: CHALLENGES & OPPORTUNITIES
            // ------------------------------------------

                                            ${escapeHtml(pill)}
                                        </button>

            // ------------------------------------------
            if (currentStep === 2) {

            if (currentStep === 5 || currentStep === 6) {

                const slotType = isFirst ? "image1" : "image2";

                mount.innerHTML = `

                                        <span class="inline-block text-[11px] font-extrabold uppercase tracking-wider px-2.5 py-1 rounded-full bg-emerald-600 text-white mb-3">
                                            Best Value
                                        </span>
                                        <div class="flex items-baseline gap-2.5">
                                            <span class="text-lg font-bold text-slate-400 line-through">$2,475</span>
                                            <span class="text-3xl font-black text-slate-900">$1,990</span>
                                        </div>
                                        <p class="text-sm font-bold text-slate-800 mt-1">10x 1 Hour Package + 1 Year Access + Certificate</p>
                                        <ul class="mt-4 space-y-2 text-xs text-slate-600">
                                            <li>&bull; 10x 1-hour 1-on-1 coaching sessions</li>
                                            <li>&bull; Full 1-year Member Hub access</li>
                                            <li>&bull; Official THPS Completion Certificate</li>
                                        </ul>
                                    </div>
                                    <a href="quick-invoice.html?pkg=10hr&name=${encodedName}&email=${encodedEmail}" target="_blank" rel="noopener noreferrer" class="mt-6 w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl text-sm text-center transition-colors shadow-sm block">
                                        Open $1,990 Quick Invoice &#8599;
                                    </a>
                                </div>
                            </div>

                            <div class="mt-6 pt-4 border-t border-slate-200 flex flex-wrap items-center justify-between gap-3 text-xs text-slate-500">
                                <div>
                                    <strong>Booking Link:</strong> <a href="${BOOKING_URL}" target="_blank" class="text-indigo-600 underline">${BOOKING_URL}</a>
                                </div>
                                <div>
                                    <strong>Member Portal:</strong> <a href="${MEMBER_PORTAL_URL}" target="_blank" class="text-indigo-600 underline">${MEMBER_PORTAL_URL}</a>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                document.getElementById("btn-sales-opt1").addEventListener("click", async (e) => {
                    if (!state.client.email) {
                        alert("Missing client email.");
                        return;
                    }
                    const btn = e.currentTarget;
                    btn.disabled = true;
                    btn.innerText = "Sending Trial Email...";

                    try {
                        const idToken = await currentUser.getIdToken();
                        const res = await fetch("/api/onboarding-actions", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json",
                                "Authorization": `Bearer ${idToken}`
                            },
                            body: JSON.stringify({
                                action: "send_trial_email",
                                clientEmail: state.client.email,
                                clientName: state.client.name || state.client.email
                            })
                        });

                        const result = await res.json();
                        if (!res.ok || !result.success) {
                            throw new Error(result.error || result.message || "Failed to send email.");
                        }

                        btn.innerText = "Trial Email Sent ✓";
                        btn.classList.replace("bg-slate-800", "bg-emerald-600");
                        showToast("Free 1-Month Trial email sent & logged to CRM!");
                    } catch (err) {
                        alert("Email Error: " + err.message);
                        btn.disabled = false;
                        btn.innerText = "Send Free Trial Email";
                    }
                });
                return;
            }

            // ------------------------------------------
            // STEP 15: BATCH SESSION BOOKING (GOOGLE CALENDAR + MEET)
            // ------------------------------------------
            if (currentStep === 15) {
                const defaultTitle = `1-on-1 Public Speaking Coaching - ${state.client.name || "Client"}`;

                mount.innerHTML = `
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8 space-y-6">
                        <div class="flex flex-wrap items-center justify-between gap-3">
                            <div>
                                <span class="text-xs font-extrabold uppercase tracking-wider text-indigo-600">Step 15 of 15</span>
                                <h2 class="text-2xl font-bold text-slate-900 mt-1">Batch Session Booking</h2>
                                <p class="text-sm text-slate-500 mt-1">Schedule multiple 1-hour coaching sessions (Adelaide time) and send Google Calendar + Google Meet invitations in one click.</p>
                            </div>
                            <button id="btn-add-session-row" type="button" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 text-xs font-extrabold px-4 py-2.5 rounded-lg transition-colors">
                                + Add Session
                            </button>
                        </div>

                        <div id="batch-sessions-list" class="space-y-3">
                            ${state.batchSessions.map((sess, idx) => `
                                <div class="grid grid-cols-1 md:grid-cols-12 gap-2.5 bg-slate-50 border border-slate-200 rounded-xl p-3.5 items-end">
                                    <div class="md:col-span-5">
                                        <label class="block text-[11px] font-bold text-slate-600 mb-1">Session #${idx + 1} Title</label>
                                        <input type="text" data-sess-idx="${idx}" data-sess-field="title" value="${escapeHtml(sess.title || defaultTitle)}" class="w-full p-2 border border-slate-300 rounded-lg bg-white text-sm">
                                    </div>
                                    <div class="md:col-span-3">
                                        <label class="block text-[11px] font-bold text-slate-600 mb-1">Date</label>
                                        <input type="date" data-sess-idx="${idx}" data-sess-field="date" value="${escapeHtml(sess.date)}" class="w-full p-2 border border-slate-300 rounded-lg bg-white text-sm">
                                    </div>
                                    <div class="md:col-span-2">
                                        <label class="block text-[11px] font-bold text-slate-600 mb-1">Time (Adelaide)</label>
                                        <input type="time" data-sess-idx="${idx}" data-sess-field="time" value="${escapeHtml(sess.time || "10:00")}" class="w-full p-2 border border-slate-300 rounded-lg bg-white text-sm">
                                    </div>
                                    <div class="md:col-span-2 flex items-center gap-2">
                                        <div class="flex-1">
                                            <label class="block text-[11px] font-bold text-slate-600 mb-1">Mins</label>
                                            <input type="number" data-sess-idx="${idx}" data-sess-field="durationMinutes" value="${sess.durationMinutes || 60}" min="15" step="15" class="w-full p-2 border border-slate-300 rounded-lg bg-white text-sm">
                                        </div>
                                        ${state.batchSessions.length > 1 ? `
                                            <button type="button" data-remove-sess="${idx}" title="Remove row" class="mt-5 px-2.5 py-2 rounded-lg bg-red-50 hover:bg-red-100 text-red-600 font-bold text-xs">
                                                &times;
                                            </button>
                                        ` : ""}
                                    </div>
                                </div>
                            `).join("")}
                        </div>

                        <div class="pt-2 flex flex-wrap items-center justify-between gap-4">
                            <a href="index.html" class="text-sm font-bold text-slate-500 hover:text-slate-800">
                                &larr; Return to CRM Pipeline
                            </a>
                            <button id="btn-send-batch-invites" type="button" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-3.5 rounded-xl shadow-md text-sm transition-colors">
                                Send All Calendar &amp; Meet Invites (${state.batchSessions.length})
                            </button>
                        </div>

                        <div id="batch-booking-results" class="hidden bg-emerald-50 border border-emerald-200 rounded-xl p-4 text-sm text-emerald-900 space-y-2"></div>
                    </div>
                `;

                document.getElementById("btn-add-session-row").addEventListener("click", () => {
                    const last = state.batchSessions[state.batchSessions.length - 1];
                    let nextDate = "";
                    if (last?.date) {
                        const d = new Date(last.date + "T00:00:00");
                        d.setDate(d.getDate() + 7);
                        nextDate = d.toISOString().slice(0, 10);
                    }
                    state.batchSessions.push({
                        title: defaultTitle,
                        date: nextDate,
                        time: last?.time || "10:00",
                        durationMinutes: last?.durationMinutes || 60
                    });
                    renderCurrentStep();
                });

                mount.querySelectorAll("[data-sess-idx]").forEach(inp => {
                    inp.addEventListener("input", (e) => {
                        const idx = Number(e.target.getAttribute("data-sess-idx"));
                        const field = e.target.getAttribute("data-sess-field");
                        state.batchSessions[idx][field] = e.target.value;
                    });
                });

                mount.querySelectorAll("[data-remove-sess]").forEach(btn => {
                    btn.addEventListener("click", () => {
                        const idx = Number(btn.getAttribute("data-remove-sess"));
                        state.batchSessions.splice(idx, 1);
                        renderCurrentStep();
                    });
                });

                document.getElementById("btn-send-batch-invites").addEventListener("click", async (e) => {
                    if (!state.client.email) {
                        alert("Client email is required.");
                        return;
                    }

                    const prepared = [];
                    for (let i = 0; i < state.batchSessions.length; i++) {
                        const s = state.batchSessions[i];
                        if (!s.date || !s.time) {
                            alert(`Please select both a date and time for Session #${i + 1}.`);
                            return;
                        }
                        const localIso = new Date(`${s.date}T${s.time}:00`).toISOString();
                        prepared.push({
                            title: s.title || defaultTitle,
                            startIso: localIso,
                            durationMinutes: Number(s.durationMinutes) || 60
                        });
                    }

                    const btn = e.currentTarget;
                    const origText = btn.innerText;
                    btn.disabled = true;
                    btn.innerText = "Creating Calendar & Meet Invites...";

                    try {
                        const idToken = await currentUser.getIdToken();
                        const res = await fetch("/api/onboarding-actions", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json",
                                "Authorization": `Bearer ${idToken}`
                            },
                            body: JSON.stringify({
                                action: "batch_book_sessions",
                                clientEmail: state.client.email,
                                clientName: state.client.name || state.client.email,
                                sessions: prepared
                            })
                        });

                        const result = await res.json();
                        if (!res.ok || !result.success) {
                            throw new Error(result.error || result.message || "Batch booking failed.");
                        }

                        const box = document.getElementById("batch-booking-results");
                        box.innerHTML = `
                            <div class="font-extrabold">Booked ${result.bookedCount} session${result.bookedCount === 1 ? '' : 's'} and emailed Calendar + Google Meet invites!</div>
                            <ul class="list-disc pl-5 text-xs space-y-1">
                                ${(result.events || []).map(ev => `
                                    <li>
                                        <strong>${escapeHtml(ev.summary)}</strong> — ${new Date(ev.start).toLocaleString('en-AU')}
                                        ${ev.meetLink ? `(<a href="${escapeHtml(ev.meetLink)}" target="_blank" class="underline font-bold">Google Meet</a>)` : ""}
                                    </li>
                                `).join("")}
                            </ul>
                        `;
                        box.classList.remove("hidden");
                        showToast(`Booked ${result.bookedCount} session(s) to Google Calendar!`);
                    } catch (err) {
                        alert("Batch Booking Error: " + err.message);
                    } finally {
                        btn.disabled = false;
                        btn.innerText = origText;
                    }
                });
            }
        }

        // ==========================================
        // FOOTER & HEADER CONTROLS
        // ==========================================
        document.getElementById("btn-prev-step").addEventListener("click", () => goToStep(currentStep - 1));
        document.getElementById("btn-next-step").addEventListener("click", () => goToStep(currentStep + 1));
        document.getElementById("btn-footer-save").addEventListener("click", () => downloadJsonPayload(`Step-${currentStep}`));
        document.getElementById("btn-header-save").addEventListener("click", () => downloadJsonPayload());

        // ==========================================
        // AUTH GUARD & FIRESTORE CLIENT HYDRATION
        // ==========================================
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "login.html";
                return;
            }
            if (user.email !== "tom@tomhendrick.com") {
                alert("Unauthorized Access: Admin privileges required.");
                await signOut(auth);
                window.location.href = "login.html";
                return;
            }

            currentUser = user;

            try {
                if (state.client.email) {
                    const snap = await getDoc(doc(db, "Clients", state.client.email));
                    if (snap.exists()) {
                        const data = snap.data();
                        state.client.name = data.name || state.client.name;
                        state.client.driveFolderUrl = data.driveFolderUrl || "";
                        state.client.driveFolderId = data.driveFolderId || "";
                    }
                }

                const labelName = state.client.name || "New Client";
                const labelEmail = state.client.email ? ` (${state.client.email})` : "";
                document.getElementById("client-header-subtitle").innerText = `Client: ${labelName}${labelEmail}`;

                document.getElementById("auth-loading").classList.add("hidden");
                document.getElementById("main-shell").classList.remove("hidden");

                renderSidebar();
                renderCurrentStep();
            } catch (err) {
                console.error("Onboarding init error:", err);
                document.getElementById("auth-loading").innerText = "Error loading client: " + err.message;
            }
        });
    </script>
</body>
</html>
