<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans p-4 md:p-8 flex items-start justify-center min-h-screen">
    
    <!-- Main Card Container -->
    <div class="w-full max-w-2xl bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col md:flex-row">
        
        <!-- Left Info Panel -->
        <div class="bg-blue-50 p-6 md:p-8 md:w-2/5 border-b md:border-b-0 md:border-r border-gray-200 flex flex-col justify-center">
            <h2 class="text-xs font-bold text-blue-600 uppercase tracking-wider mb-2">Tom Hendrick</h2>
            <h1 class="text-2xl font-bold text-gray-900 mb-4">Get in Touch</h1>
            <p class="text-sm text-gray-600">Have a question about public speaking coaching? Send me a message and I'll get back to you shortly.</p>
        </div>

        <!-- Right Form Panel -->
        <div class="p-6 md:p-8 md:w-3/5">
            <form id="enquiry-form" class="space-y-4">
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                    <input type="text" id="name" required class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600">
                </div>
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                    <input type="email" id="email" required class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600">
                </div>
                <div>
                    <label for="message" class="block text-sm font-medium text-gray-700 mb-1">How can I help you?</label>
                    <textarea id="message" rows="4" required class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600"></textarea>
                </div>
                <button type="submit" id="submit-btn" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-md hover:bg-blue-700 transition-colors shadow-sm">Send Message</button>
            </form>

            <!-- Success Message (Hidden by default) -->
            <div id="success-message" class="hidden bg-green-50 text-green-800 p-6 rounded-lg border border-green-200 text-center mt-4">
                <h3 class="text-lg font-bold mb-2">Message Sent!</h3>
                <p class="text-sm">Thank you for reaching out. I will be in touch soon.</p>
            </div>
        </div>
    </div>

    <script>
        // Temporary UI Logic - We will wire this to /api/submit-enquiry next!
        document.getElementById('enquiry-form').addEventListener('submit', (e) => {
            e.preventDefault(); // Stop page from refreshing
            
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerText = 'Sending...';

            // Simulate a network delay of 1 second
            setTimeout(() => {
                document.getElementById('enquiry-form').classList.add('hidden');
                document.getElementById('success-message').classList.remove('hidden');
            }, 1000);
        });
    </script>
</body>
</html>
