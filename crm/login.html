<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Login | THPS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 h-screen flex justify-center items-center font-sans">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md text-center border border-gray-200">
        <div class="w-16 h-16 bg-slate-800 rounded-full flex items-center justify-center mx-auto mb-4 shadow-sm">
            <i class="fa-solid fa-lock text-white text-2xl"></i>
        </div>
        <h1 class="text-2xl font-extrabold text-slate-800 mb-2">CRM Pipeline</h1>
        <p class="text-gray-500 mb-8 text-sm">Please sign in to access client data.</p>

        <button id="google-login-btn" class="w-full bg-white border border-gray-300 text-gray-700 font-bold py-3 px-4 rounded-lg hover:bg-gray-50 transition-colors flex items-center justify-center gap-3 shadow-sm">
            <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-5 h-5">
            Sign in with Google
        </button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDOUyOnxrYzL_lFe86pA5M61CI1N7ER5gU",
            authDomain: "thps-crm.firebaseapp.com",
            projectId: "thps-crm",
            storageBucket: "thps-crm.firebasestorage.app",
            messagingSenderId: "297605373498",
            appId: "1:297605373498:web:606241a173f3150a16df03"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // Redirect immediately if already logged in
        onAuthStateChanged(auth, (user) => {
            if (user) window.location.href = 'index.html';
        });

        // Handle Google Login
        document.getElementById('google-login-btn').addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, provider);
                window.location.href = 'index.html';
            } catch (error) {
                console.error(error);
                alert("Login failed: " + error.message);
            }
        });
    </script>
</body>
</html>
