<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THPS Member Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="w-full h-screen overflow-x-hidden relative text-slate-800 pb-24">

    <!-- TOP HUD -->
    <header class="fixed top-0 left-0 w-full bg-[#F6F4EE]/90 backdrop-blur-md z-40 px-5 py-4 flex justify-between items-center border-b border-slate-200">
        <div class="flex items-center gap-2 bg-white px-3 py-1.5 rounded-full shadow-sm border border-slate-100">
            <i data-lucide="flame" class="w-5 h-5 text-orange-500 fill-orange-500"></i>
            <span id="streak-counter" class="font-bold text-sm text-slate-700">0</span>
        </div>
        
        <div id="trigger-drawer" class="flex items-center gap-2 cursor-pointer active:scale-95 transition-transform">
            <div class="flex flex-col items-end">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Level</span>
                <span id="xp-counter" class="font-bold text-sm text-[#D4AF37]">0 XP</span>
            </div>
            <div class="relative w-10 h-10">
                <svg viewBox="0 0 100 100" class="w-full h-full wreath-gold drop-shadow-sm">
                    <path d="M 50,90 C 20,90 10,60 10,30 C 10,20 15,10 20,10" fill="none" stroke-width="4" stroke-linecap="round"/>
                    <path d="M 10,30 Q 15,40 25,35 Q 20,25 10,30 Z" /> <path d="M 12,45 Q 20,55 30,48 Q 22,38 12,45 Z" /> <path d="M 18,60 Q 28,68 38,60 Q 28,50 18,60 Z" /> <path d="M 28,75 Q 38,80 48,70 Q 38,60 28,75 Z" />
                    <path d="M 50,90 C 80,90 90,60 90,30 C 90,20 85,10 80,10" fill="none" stroke-width="4" stroke-linecap="round"/>
                    <path d="M 90,30 Q 85,40 75,35 Q 80,25 90,30 Z" /> <path d="M 88,45 Q 80,55 70,48 Q 78,38 88,45 Z" /> <path d="M 82,60 Q 72,68 62,60 Q 72,50 82,60 Z" /> <path d="M 72,75 Q 62,80 52,70 Q 62,60 72,75 Z" />
                </svg>
                <div class="absolute inset-0 flex items-center justify-center mt-1">
                    <span id="user-initial" class="serif font-bold text-xl text-[#D4AF37]">?</span>
                </div>
            </div>
        </div>
    </header>

    <div class="h-20"></div>

    <!-- VIEW 1: HOME -->
    <main id="view-home" class="px-5 w-full max-w-md mx-auto fade-in">
        <h1 class="text-3xl serif mt-4 mb-6">Learn</h1>
        
        <!-- Populated via JSON -->
        <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 mb-8 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-[#D4AF37]"></div>
            <div class="flex justify-between items-start mb-4">
                <div>
                    <span class="text-xs font-black uppercase text-[#D4AF37] tracking-widest bg-yellow-50 px-2 py-1 rounded-md">Daily Quest</span>
                    <h2 id="quest-title" class="text-xl font-bold mt-2">Loading...</h2>
                    <p id="quest-desc" class="text-sm text-slate-500 mt-1"></p>
                </div>
                <div class="bg-[#F6F4EE] p-2 rounded-xl flex flex-col items-center justify-center">
                    <span id="quest-xp" class="text-[#D4AF37] font-black">+0</span>
                    <span class="text-[10px] font-bold text-slate-400 uppercase">XP</span>
                </div>
            </div>
            <button class="w-full btn-chunky btn-chunky-primary rounded-2xl py-4 font-bold text-lg tracking-wide">Start Recording</button>
        </div>

        <h3 class="text-lg font-bold mb-4">Practice Prompts</h3>
        <div id="prompts-container" class="grid grid-cols-2 gap-4">
            <!-- Cards injected by app.js -->
        </div>
    </main>

    <!-- VIEW 2: STATS -->
    <main id="view-stats" class="px-5 w-full max-w-md mx-auto hide">
        <h1 class="text-3xl serif mt-4 mb-2">Your Mastery</h1>
        <p class="text-sm text-slate-500 mb-8">Tap a pillar to review your performance insights.</p>
        <div class="grid grid-cols-2 gap-6">
            <!-- Standard Wreath Buttons (Truncated for brevity, use previous HTML blocks here) -->
            <div id="trigger-deepdive" class="flex flex-col items-center justify-center bg-white p-6 rounded-3xl shadow-sm border border-slate-100 cursor-pointer active:scale-95 transition-transform">
                <h3 class="font-bold text-slate-700">Delivery</h3>
            </div>
        </div>
    </main>

    <!-- DRAWER: TROPHIES -->
    <div id="trophy-drawer" class="fixed inset-y-0 right-0 w-80 bg-[#F6F4EE] shadow-2xl z-50 transform translate-x-full transition-transform duration-300 flex flex-col border-l border-slate-200">
        <div class="p-5 flex justify-between items-center bg-white border-b border-slate-200">
            <h2 class="serif text-2xl font-bold">Achievements</h2>
            <button id="close-drawer" class="p-2 bg-slate-100 rounded-full text-slate-500"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <div id="trophies-container" class="flex-1 overflow-y-auto p-5 space-y-4">
            <!-- Trophies injected by app.js -->
        </div>
    </div>

    <!-- FLOATING BOTTOM NAV -->
    <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-[#EFECE3] px-6 py-4 rounded-full shadow-lg border border-slate-200/50 flex items-center justify-between gap-8 z-40 backdrop-blur-md">
        <button id="nav-stats" class="text-slate-400 hover:text-slate-800 transition-colors"><i data-lucide="bar-chart-2" class="w-6 h-6"></i></button>
        <button id="nav-home" class="text-slate-800 transition-colors"><i data-lucide="book-open" class="w-6 h-6"></i></button>
        <button id="nav-trophies" class="text-slate-400 hover:text-slate-800 transition-colors"><i data-lucide="award" class="w-6 h-6"></i></button>
        <button class="text-slate-400 hover:text-indigo-600 transition-colors relative"><i data-lucide="message-square" class="w-6 h-6 fill-white"></i><span class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-[9px] font-black mt-[-1px]">AI</span></button>
    </nav>

    <div id="drawer-overlay" class="fixed inset-0 bg-slate-900/20 backdrop-blur-sm z-40 hide transition-opacity"></div>

    <!-- ES6 Module Script for Firebase & Logic -->
    <script type="module" src="app.js"></script>
</body>
</html>
