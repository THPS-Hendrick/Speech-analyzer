<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mic-Check App Native Hub | THPS</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="/image/thps-logo-golden-wreath.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Central Firebase Engine -->
    <script type="module" src="/js/firebase-client.js"></script>

    <!-- UI Libs -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>

    <!-- Compromise NLP for the Analyzer -->
    <script src="https://unpkg.com/compromise@14.14.3/builds/compromise.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { green: '#106030', dark: '#0c4a25', gold: '#FFCC00', offwhite: '#FAF9F5' }
                    }
                }
            }
        }
    </script>
    <style>
        /* Base styles from the original analyzer app */
        :fullscreen { overflow-y: auto !important; background-color: #f8fafc; }
        :-webkit-full-screen { overflow-y: auto !important; background-color: #f8fafc; }
    </style>
</head>
<body class="bg-brand-offwhite font-sans text-slate-900 antialiased flex flex-col min-h-screen relative">

    <!-- INJECT_HEADER -->

    <!-- Auth & Paywall Guard Loading Overlay -->
    <div id="loading-overlay" class="fixed inset-0 bg-brand-offwhite z-[60] flex flex-col items-center justify-center transition-opacity duration-500">
        <i class="fa-solid fa-circle-notch fa-spin text-4xl text-brand-green mb-4"></i>
        <h2 id="loading-text" class="text-xl font-bold text-slate-900 tracking-tight">Authenticating...</h2>
        <div id="error-message" class="hidden mt-4 text-red-600 font-medium text-sm text-center max-w-md px-4"></div>
    </div>

    <!-- MAIN DASHBOARD -->
    <main class="flex-grow w-full pb-20 pt-8 relative z-10" id="main-app-container">
        
        <div class="max-w-7xl mx-auto px-2 sm:px-4">
            
            <header class="mb-6 flex justify-between items-end border-b border-gray-200 pb-4">
                <div>
                    <h1 class="text-2xl font-black text-slate-900">Mic-Check Dashboard</h1>
                    <p class="text-gray-500 text-sm">Welcome back, <span class="auth-user-name">Member</span>.</p>
                </div>
            </header>

            <div id="cba-wrapper" class="w-full">
                <!-- Native UI container where the web components will mount -->
                <div id="cba-resultsContainer" class="flex flex-col space-y-6">
                    <div id="thps-dashboard-grid" class="flex flex-wrap gap-4 w-full items-start min-h-[150px]">
                        
                        <!-- Core Layout matching Option A architecture -->
                        <div class="w-full relative group">
                            <thps-main-dash></thps-main-dash>
                        </div>
                        
                        <div class="w-full md:w-[calc(50%-0.5rem)] relative group">
                            <thps-timer-med></thps-timer-med>
                        </div>
                        
                        <div class="w-full md:w-[calc(50%-0.5rem)] relative group">
                            <thps-upload-speech-med></thps-upload-speech-med>
                        </div>
                        
                        <div class="w-full relative group">
                            <thps-voice-timeline></thps-voice-timeline>
                        </div>

                    </div>
                </div>
            </div>
            
            <textarea id="cba-inputText" class="hidden"></textarea>
            
        </div>
    </main>

    <!-- INJECT_FOOTER -->

    <!-- Load the Analyzer Engines (Delayed slightly so DOM can parse) -->
    <script defer src="https://raw.githack.com/THPS-Hendrick/Speech-analyzer/main/engines/nlp-scorer.js"></script>
    <script defer src="https://raw.githack.com/THPS-Hendrick/Speech-analyzer/main/engines/audio-processor.js"></script>
    
    <!-- Load Core Web Components natively -->
    <script defer src="https://raw.githack.com/THPS-Hendrick/Speech-analyzer/main/components/dashboard-manager.js"></script>
    <script defer src="https://raw.githack.com/THPS-Hendrick/Speech-analyzer/main/components/large/main-dash.js"></script>
    <script defer src="https://raw.githack.com/THPS-Hendrick/Speech-analyzer/main/components/medium/timer-med.js"></script>
    <script defer src="https://raw.githack.com/THPS-Hendrick/Speech-analyzer/main/components/medium/upload-med.js"></script>
    <script defer src="https://raw.githack.com/THPS-Hendrick/Speech-analyzer/main/components/large/voice-timeline.js"></script>
    <script defer src="https://raw.githack.com/THPS-Hendrick/Speech-analyzer/main/components/small/pill-wps.js"></script>
    <script defer src="https://raw.githack.com/THPS-Hendrick/Speech-analyzer/main/components/small/pill-pause.js"></script>
    <script defer src="https://raw.githack.com/THPS-Hendrick/Speech-analyzer/main/components/small/pill-pace.js"></script>
    <script defer src="https://raw.githack.com/THPS-Hendrick/Speech-analyzer/main/components/small/pill-personal.js"></script>
    <script defer src="https://raw.githack.com/THPS-Hendrick/Speech-analyzer/main/components/small/pill-visual.js"></script>
    <script defer src="https://raw.githack.com/THPS-Hendrick/Speech-analyzer/main/components/small/pill-intangible.js"></script>

    <!-- Native App Execution Logic -->
    <script>
        // ==========================================
        // 1. Auth & Subscription Paywall Guard
        // ==========================================
        const checkAccessReady = setInterval(async () => {
            if (typeof window.checkMemberAccess === 'function') {
                clearInterval(checkAccessReady);

                const loadingText = document.getElementById('loading-text');
                if (loadingText) loadingText.textContent = 'Verifying membership access...';

                try {
                    const access = await window.checkMemberAccess({
                        redirectIfUnpaid: true,
                        upgradeUrl: '/members/account.html?upgrade=1'
                    });

                    if (!access.allowed) {
                        if (access.reason === 'unauthenticated') {
                            window.location.href = '/members/login.html';
                        }
                        return;
                    }

                    const loader = document.getElementById('loading-overlay');
                    if (loader) {
                        loader.classList.add('opacity-0');
                        setTimeout(() => loader.remove(), 500);
                    }

                    if (window.lucide) lucide.createIcons();
                } catch (err) {
                    console.error('Membership access check failed:', err);
                    const errorEl = document.getElementById('error-message');
                    if (errorEl) {
                        errorEl.textContent = 'Unable to verify membership access. Please refresh the page or sign in again.';
                        errorEl.classList.remove('hidden');
                    }
                }
            }
        }, 100);

        // ==========================================
        // 2. Global State Engine (Required by Web Components)
        // ==========================================
        window.gameTimerInterval = null;
        window.isActive = false;
        
        window.thps_sessionHistory = [];
        window.thps_currentAttemptId = 1;
        window.thps_lastPayload = null;
        
        window.explanationsData = null;
        window.FALLBACK_EXPLANATIONS = {
            "Score Summary": "Measures your Content, Delivery, and Simplicity. Metrics in the green zone get +10 points.",
            "Grade": "Your final score out of 100.",
            "Personal": "Measures storytelling. Aim for 30-60%.",
            "Visual": "Measures sensory words that paint a picture. Aim for 20-50%.",
            "Intangible": "Measures abstract concepts and filler. Keep it between 10-30%.",
            "Words/min": "Your speaking pace. The sweet spot is 100-155 words per minute.",
            "Syllable/sec": "Our 'Mumble Meter'. The green zone is 3.5 to 4.5 syllables per second.",
            "Pause %": "The percentage of time you spend silent. Aim for 15-35%.",
            "Runtime": "The average seconds you speak continuously before a meaningful pause. Aim for 3.0s to 7.0s.",
            "Read-Level": "The reading grade level of your speech.",
            "Simple %": "The percentage of your words within the 10,000 most common English words. Aim for 80-90%."
        };

        // ==========================================
        // 3. Central Math & Utilities
        // ==========================================
        window.getMetricPoints = function(key, val) {
            const limits = {
                personal:   [0,    20,   30,   60,   70,   100],
                visual:     [0,    10,   20,   50,   60,   100],
                intangible: [0,    5,    10,   30,   35,   100],
                wpm:        [50,   90,   100,  155,  165,  200], 
                sps:        [2.0,  3.0,  3.5,  4.5,  5.0,  6.0], 
                pause:      [0,    10,   15,   35,   40,   60],  
                runtime:    [0.0,  2.0,  3.0,  7.0,  9.0,  12.0], 
                readlevel:  [2.0,  4.5,  6.0,  11.0, 12.5, 16.0], 
                simple:     [50,   75,   80,   90,   95,   100], 
                clarity:    [60,   80,   90,   100,  100.1, 100.2] 
            };
            
            if (!limits[key] || val === undefined || val === null || isNaN(val)) return 0.0;
            const [minRed, minYellow, minGreen, maxGreen, maxYellow, maxRed] = limits[key];

            if (val >= minGreen && val <= maxGreen) return 10.0;

            if (val < minGreen) {
                if (val <= minRed) return 0.0; 
                if (val >= minYellow) {
                    if (minGreen === minYellow) return 10.0;
                    const ratio = (val - minYellow) / (minGreen - minYellow);
                    return Math.max(4.0, Math.min(10.0, 4.0 + (ratio * 6.0)));
                } else {
                    if (minYellow === minRed) return 0.0;
                    const ratio = (val - minRed) / (minYellow - minRed);
                    return Math.max(0.0, Math.min(4.0, ratio * 4.0));
                }
            }

            if (val > maxGreen) {
                if (val >= maxRed) return 0.0; 
                if (val <= maxYellow) {
                    if (maxYellow === maxGreen) return 4.0;
                    const ratio = (maxYellow - val) / (maxYellow - maxGreen);
                    return Math.max(4.0, Math.min(10.0, 4.0 + (ratio * 6.0)));
                } else {
                    if (maxRed === maxYellow) return 0.0;
                    const ratio = (maxRed - val) / (maxRed - maxYellow);
                    return Math.max(0.0, Math.min(4.0, ratio * 4.0));
                }
            }
            return 0.0;
        };

        window.formatMetric = function(key, val) {
            if (val === null || val === undefined) return '-';
            if (key === 'time') return `${Math.floor(val / 60)}:${Math.floor(val % 60).toString().padStart(2, '0')}`;
            if (['totalPoints', 'sps', 'grade', 'readlevel'].includes(key)) return val.toFixed(1);
            if (key === 'runtime') return val.toFixed(1) + 's';
            if (['pause', 'personal', 'visual', 'intangible', 'simple'].includes(key)) return val.toFixed(0) + '%';
            return Math.round(val);
        };

        // ==========================================
        // 4. The Master Analysis Bridge
        // ==========================================
        window.analyze = function() {
            console.log("Analyzing audio natively...");
            
            if (!window.THPS || !window.THPS.NLP || typeof window.THPS.NLP.analyzeSpeech !== 'function') {
                console.warn("NLP Engine not fully loaded yet.");
                return;
            }

            let text = "";
            const hiddenEl = document.getElementById('cba-inputText');
            if (hiddenEl) text = hiddenEl.value.trim();
            
            if (!text) {
                window.dispatchEvent(new CustomEvent('thps-dashboard-update', { detail: { text: "" } }));
                return;
            }

            let timestamps = [];
            let volumeData = [];
            let elapsedSecs = 0;

            if (window.THPS.Audio) {
                if (window.THPS.Audio.recordedAudio && window.THPS.Audio.wordTimestamps) {
                    timestamps = window.THPS.Audio.wordTimestamps;
                }
                if (window.THPS.Audio.volumeData) {
                    volumeData = window.THPS.Audio.volumeData;
                }
                elapsedSecs = window.THPS.Audio.recordedAudio ? (window.THPS.Audio.lastRecordedDuration || 0) : 0;
            }
            
            // Execute the Heavy Math Engine
            let masterData = window.THPS.NLP.analyzeSpeech(text, timestamps, volumeData, elapsedSecs);

            const { 
                numWords = 0, numSentences = 0, totalSyllables = 0,
                personalCount = 0, visualCount = 0, unifiedSimpleCount = 0, 
                highlightedHTML = "", wordTimestamps = [] 
            } = masterData;

            const mumbleScore = masterData.mumbleScore || 0;
            const avgWpm = masterData.wpm || 0;
            const pausePercent = masterData.pausePercent || 0;
            const finalRuntime = masterData.runtime || 0; 
            
            let coreSimpleScore = numWords > 0 ? Math.round((unifiedSimpleCount / numWords) * 100) : 0;
            let avgGrade = 0;
            if (typeof window.THPS.NLP.calculateReadabilityMetrics === 'function') {
                 let readability = window.THPS.NLP.calculateReadabilityMetrics(numWords, numSentences, totalSyllables, 0, 0);
                 avgGrade = readability.avgGrade;
            }

            let personalPercent = numWords > 0 ? Math.round((personalCount / numWords) * 100) : 0;
            let visualPercent = numWords > 0 ? Math.round((visualCount / numWords) * 100) : 0;
            let intangiblePercent = Math.max(0, 100 - personalPercent - visualPercent);
            
            let clarityPercent = 0;
            if (timestamps && timestamps.length > 0) {
                const validWords = timestamps.filter(w => w.confidence !== undefined);
                if (validWords.length > 0) {
                    const sumConf = validWords.reduce((sum, w) => sum + w.confidence, 0);
                    clarityPercent = Math.round((sumConf / validWords.length) * 100);
                }
            }

            // Grade Computation
            let totalPoints = 0;
            let overrideGrade = (!window.THPS.Audio || !window.THPS.Audio.recordedAudio || elapsedSecs === 0);

            const scoreKeys = [
                {k: 'personal', v: personalPercent}, 
                {k: 'visual', v: visualPercent}, 
                {k: 'intangible', v: intangiblePercent}, 
                {k: 'wpm', v: avgWpm}, 
                {k: 'sps', v: mumbleScore}, 
                {k: 'pause', v: pausePercent}, 
                {k: 'runtime', v: finalRuntime}, 
                {k: 'readlevel', v: avgGrade}, 
                {k: 'simple', v: coreSimpleScore},
                {k: 'clarity', v: clarityPercent}
            ];

            scoreKeys.forEach(metric => {
                totalPoints += window.getMetricPoints(metric.k, metric.v);
            });

            // Construct Final Payload cache
            const payload = { 
                id: window.thps_currentAttemptId,
                title: 'Attempt ' + window.thps_currentAttemptId,
                date: new Date(),
                sps: mumbleScore, wpm: avgWpm, readlevel: avgGrade, time: elapsedSecs,
                personal: personalPercent, visual: visualPercent, intangible: intangiblePercent,
                pause: pausePercent, runtime: finalRuntime, simple: coreSimpleScore,
                totalPoints: totalPoints, clarity: clarityPercent, overrideGrade: overrideGrade,
                text: text, wordTimestamps: wordTimestamps, volumeData: volumeData,
                pauseEvents: masterData.pauseEvents || [], runPaces: masterData.runPaces || [],
                runBuckets: masterData.runBuckets || { vFast: 0, fast: 0, norm: 0, slow: 0, vSlow: 0 }, 
                volumeBuckets: masterData.volumeBuckets || { vLow: 0, low: 0, norm: 0, high: 0, vHigh: 0 },
                recordedAudio: window.THPS.Audio ? window.THPS.Audio.recordedAudio : false
            };
            
            window.thps_lastPayload = payload;

            // Save to Session History array
            if (text.trim() !== '' || elapsedSecs > 0) {
                let existingIndex = window.thps_sessionHistory.findIndex(h => h.id === window.thps_currentAttemptId);
                if (existingIndex >= 0) {
                    window.thps_sessionHistory[existingIndex] = payload;
                } else {
                    window.thps_sessionHistory.unshift(payload); 
                }
                
                // Save to CRM explicitly if function is available
                if (window.saveLessonProgress) {
                    window.saveLessonProgress('freestyle-practice', totalPoints);
                }
                
                window.thps_currentAttemptId++;
            }

            // BROADCAST EVENT TO COMPONENTS
            window.dispatchEvent(new CustomEvent('thps-dashboard-update', { detail: payload }));
        };

        // ==========================================
        // 5. Hardware Controls
        // ==========================================
        window.toggleRecording = function() {
            if (window.isActive) {
                window.isActive = false;
                if (window.THPS && window.THPS.Audio && typeof window.THPS.Audio.stopRecordingProcess === 'function') {
                    window.THPS.Audio.stopRecordingProcess();
                }
            } else {
                window.isActive = true;
                if (window.THPS && window.THPS.Audio && typeof window.THPS.Audio.startRecordingProcess === 'function') {
                    window.THPS.Audio.startRecordingProcess();
                }
            }
            if (window.lucide) lucide.createIcons();
        };

        window.clearAnalyzer = function() {
            const hiddenEl = document.getElementById('cba-inputText');
            if (hiddenEl) hiddenEl.value = '';
            if (window.THPS && window.THPS.Audio) {
                window.THPS.Audio.recordedAudio = false; 
                window.THPS.Audio.lastRecordedDuration = 0;
                window.THPS.Audio.wordTimestamps = []; 
                window.THPS.Audio.volumeData = [];
            }
            window.thps_lastPayload = null; 
            window.analyze();
        };
        
        // Setup initial dict fetch
        window.onload = () => {
            setTimeout(() => {
                if (window.THPS && window.THPS.NLP && typeof window.THPS.NLP.loadDictionaries === 'function') {
                    window.THPS.NLP.loadDictionaries();
                }
            }, 500);
        };
    </script>
</body>
</html>
