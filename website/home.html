<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tom Hendrick - Data-Driven Public Speaking Training</title>
    <meta name="description" content="Master public speaking through classes, coaching and the Mic-Check App. Tom Hendrick provides a data-driven approach to improving communication skills for corporate professionals.">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/image/thps-logo-golden-wreath.svg">
    
    <!-- Local Business NAP Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "Tom Hendrick Public Speaking",
      "legalName": "Thomas Geoffrey Hendrick",
      "url": "https://tomhendrick.com",
      "telephone": "+61419499331",
      "vatID": "56949157639",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Suite 110, 147 Pirie Street",
        "addressLocality": "Adelaide",
        "addressRegion": "SA",
        "postalCode": "5000",
        "addressCountry": "AU"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": "-34.9252",
        "longitude": "138.6063"
      }
    }
    </script>

    <!-- FAQPage Schema for AI Overviews -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [{
        "@type": "Question",
        "name": "What is a good words-per-minute pace for a business presentation?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "According to Mic-Check data, the ideal pace for a corporate presentation is between 130 and 150 words per minute."
        }
      }]
    }
    </script>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            green: '#106030',
                            dark: '#0c4a25',
                            gold: '#FFCC00',
                            offwhite: '#FAF9F5'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        html { scroll-behavior: smooth; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Floating Panel Hover Effects */
        .panel-btn { transition: all 0.2s ease; }
        .panel-btn:hover { transform: translateY(-3px); color: #106030; }

        /* FAQ Accordion Transitions */
        .faq-answer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-in-out, opacity 0.3s ease-in-out, margin-top 0.3s ease-in-out;
            opacity: 0;
        }
        .faq-answer.open {
            max-height: 500px;
            opacity: 1;
            margin-top: 1rem;
        }
        .faq-icon { transition: transform 0.2s ease-in-out; }
        .faq-icon.open { transform: rotate(180deg); }
    </style>
</head>
<body class="bg-brand-offwhite font-sans text-slate-900 antialiased flex flex-col min-h-screen relative pb-24">

    <!-- INJECT_HEADER -->

    <!-- FLOATING 5X BOTTOM PANEL (APP / PLG NAVIGATION) -->
    <nav id="floating-panel" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-white rounded-full shadow-[0_10px_40px_-10px_rgba(0,0,0,0.3)] border border-gray-200 px-2 py-2 flex items-center gap-1 sm:gap-2 z-[60] transition-transform duration-300">
        <a href="/services/mic-check-app.html" class="panel-btn flex flex-col items-center justify-center w-14 h-14 rounded-full text-slate-500 hover:bg-green-50">
            <i class="fa-solid fa-microphone-lines text-xl mb-1"></i>
            <span class="text-[9px] font-bold uppercase tracking-wider">App</span>
        </a>
        <a href="/services/thps-speech-assessment.html" class="panel-btn flex flex-col items-center justify-center w-14 h-14 rounded-full text-slate-500 hover:bg-green-50">
            <i class="fa-solid fa-user-tie text-xl mb-1"></i>
            <span class="text-[9px] font-bold uppercase tracking-wider">Coach</span>
        </a>
        <a href="/services/online-classes.html" class="panel-btn flex flex-col items-center justify-center w-14 h-14 rounded-full text-slate-500 hover:bg-green-50">
            <i class="fa-solid fa-chalkboard-user text-xl mb-1"></i>
            <span class="text-[9px] font-bold uppercase tracking-wider">Class</span>
        </a>
        <a href="/members/account.html" class="panel-btn flex flex-col items-center justify-center w-14 h-14 rounded-full text-slate-500 hover:bg-green-50">
            <i class="fa-regular fa-circle-user text-xl mb-1"></i>
            <span class="text-[9px] font-bold uppercase tracking-wider">You</span>
        </a>
        <div class="w-px h-8 bg-gray-200 mx-1"></div>
        <button id="btn-dismiss-panel" class="w-10 h-10 flex items-center justify-center rounded-full text-gray-400 hover:bg-red-50 hover:text-red-500 transition-colors focus:outline-none">
            <i class="fa-solid fa-xmark text-lg"></i>
        </button>
    </nav>

    <!-- MAIN CONTENT BODY -->
    <main class="flex-grow w-full">
        <!-- Add your Hero, Features, Courses, Testimonials, and FAQ Sections here -->
    </main>

    <!-- INJECT_FOOTER -->

    <!-- PAGE-SPECIFIC INTERACTION SCRIPTS -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Note: The Header auth toggle and mobile menu scripts are now baked into the INJECT_HEADER block.

            // --- Floating Bottom Panel Dismiss Logic ---
            const floatingPanel = document.getElementById('floating-panel');
            const dismissBtn = document.getElementById('btn-dismiss-panel');
            if (floatingPanel && dismissBtn) {
                dismissBtn.addEventListener('click', () => {
                    floatingPanel.style.transform = 'translate(-50%, 150%)';
                    setTimeout(() => { floatingPanel.remove(); }, 300);
                });
            }

            // --- FAQ Accordion Logic ---
            const faqButtons = document.querySelectorAll('.faq-btn');
            faqButtons.forEach(button => {
                button.addEventListener('click', () => {
                    const answer = button.nextElementSibling;
                    const icon = button.querySelector('.faq-icon');
                    answer.classList.toggle('open');
                    icon.classList.toggle('open');
                });
            });
        });
    </script>
</body>
</html>
