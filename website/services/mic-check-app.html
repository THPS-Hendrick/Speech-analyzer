<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mic-Check App | AI Public Speaking Telemetry</title>
    <meta name="description" content="Stop guessing how you sound. The Mic-Check App measures your pace, pause ratio, and vocabulary mix in real-time. Try the free demo or subscribe for full access.">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="https://raw.githubusercontent.com/THPS-Hendrick/Speech-analyzer/main/image/thps-logo-golden-wreath.svg">
    
    <!-- Google Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { green: '#106030', dark: '#0c4a25', gold: '#FFCC00', offwhite: '#FAF9F5' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-offwhite font-sans text-slate-900 antialiased flex flex-col min-h-screen">

    <!-- INJECT_HEADER -->

    <main class="flex-grow w-full pb-10 pt-12 md:pt-16 px-4 sm:px-6">
        <div class="max-w-7xl mx-auto">
            
            <!-- Breadcrumb -->
            <a href="/services/services.html" class="text-brand-green text-sm font-bold mb-8 inline-flex items-center gap-2 hover:underline tracking-wide uppercase">
                <i class="fa-solid fa-arrow-left"></i> Back to Services
            </a>
            
            <!-- Page Header -->
            <header class="mb-8 text-center max-w-4xl mx-auto">
                <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-blue-50 border border-blue-200 text-blue-700 text-xs font-bold uppercase tracking-wider mb-6">
                    <i class="fa-solid fa-laptop-code"></i> SaaS Technology
                </div>
                <h1 class="text-4xl md:text-5xl lg:text-6xl font-extrabold text-slate-900 mb-6 tracking-tight">The Trackman for Public Speaking</h1>
                <p class="text-lg md:text-xl text-gray-600 mb-10 leading-relaxed">
                    Stop guessing how you sound. Use the dashboard below to record a brief baseline, then view your full acoustic telemetry and NLP report.
                </p>
            </header>

            <!-- FULL WORKING APP IFRAME -->
            <div class="w-full mx-auto rounded-[2rem] overflow-hidden shadow-2xl border border-slate-200 bg-white">
                <iframe 
                  src="https://mic-check-backend.vercel.app/analyzer-app.html" 
                  style="width: 100%; height: 7000px; border: none; background: transparent; overflow: hidden;" 
                  allow="camera; microphone; autoplay; playsinline"
                  scrolling="no">
                </iframe>
            </div>

        </div>
    </main>

    <!-- INJECT_FOOTER -->

</body>
</html>
