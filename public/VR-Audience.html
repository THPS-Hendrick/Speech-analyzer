<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Audience Behaviour Board</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white h-screen flex font-sans overflow-hidden">

    <aside class="w-1/3 bg-gray-800 p-6 flex flex-col gap-6 shadow-2xl z-10 overflow-y-auto">
        
        <div>
            <h1 class="text-2xl font-bold mb-2">Audience Control</h1>
            <p class="text-gray-400 text-sm">Select room size and trigger behaviours.</p>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-300 mb-2">Audience Size</label>
            <select id="audience-size" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white outline-none focus:border-blue-500">
                <option value="small">Small (2 People - Interview)</option>
                <option value="medium" selected>Medium (20 People - Classroom)</option>
                <option value="large">Large (100+ People - Theatre)</option>
            </select>
        </div>

        <hr class="border-gray-700">

        <div>
            <h2 class="text-sm font-medium text-gray-300 mb-3">Active Behaviours (Widgets)</h2>
            <div id="button-container" class="grid grid-cols-2 gap-3">
                </div>
        </div>
        
        <audio id="action-audio"></audio>
    </aside>

    <main class="w-2/3 bg-black flex items-center justify-center relative">
        
        <div id="status-indicator" class="absolute top-4 right-4 bg-green-600 text-white text-xs px-3 py-1 rounded-full opacity-50">
            Idle
        </div>

        <img id="audience-display" src="" alt="Audience Display" class="w-full h-full object-cover">
        
    </main>

    <script>
        // --- 1. THE DATA STRUCTURE ---
        // Here you define your asset paths and duration (in milliseconds)
        const library = {
            small: {
                idle: 'assets/small/idle.gif', // Placeholder path
                actions: [
                    { id: 's-nod', label: 'Attentive Nod', visual: 'assets/small/nod.gif', audio: null, duration: 4000 },
                    { id: 's-write', label: 'Taking Notes', visual: 'assets/small/notes.gif', audio: 'assets/small/scribble.mp3', duration: 5000 }
                ]
            },
            medium: {
                idle: 'https://media.giphy.com/media/l0HlRnAWXxn0MhKLK/giphy.gif', // Real placeholder for testing
                actions: [
                    { id: 'm-clap', label: 'Polite Clap', visual: 'https://media.giphy.com/media/3o7TKoWXm3okO1kgHC/giphy.gif', audio: 'path-to-medium-clap.mp3', duration: 6000 },
                    { id: 'm-cough', label: 'One Cough', visual: 'https://media.giphy.com/media/26FPCXdkvDbKBbgOI/giphy.gif', audio: 'path-to-cough.mp3', duration: 3000 },
                    { id: 'm-laugh', label: 'Light Laughter', visual: 'https://media.giphy.com/media/3oFzmpzTfyABIX6EqY/giphy.gif', audio: 'path-to-laugh.mp3', duration: 5000 }
                ]
            },
            large: {
                idle: 'assets/large/idle.gif',
                actions: [
                    { id: 'l-cheer', label: 'Standing Ovation', visual: 'assets/large/cheer.gif', audio: 'assets/large/cheer.mp3', duration: 10000 },
                    { id: 'l-murmur', label: 'Restless Murmuring', visual: 'assets/large/murmur.gif', audio: 'assets/large/murmur.mp3', duration: 8000 }
                ]
            }
        };

        // --- 2. DOM ELEMENTS ---
        const sizeSelector = document.getElementById('audience-size');
        const buttonContainer = document.getElementById('button-container');
        const display = document.getElementById('audience-display');
        const audioPlayer = document.getElementById('action-audio');
        const statusIndicator = document.getElementById('status-indicator');

        // --- 3. STATE MANAGEMENT ---
        let currentSize = 'medium';
        let actionTimeout = null; // Keeps track of the timer to return to idle

        // --- 4. CORE FUNCTIONS ---

        // Sets the screen back to the idle loop for the current size
        function setIdleState() {
            const currentIdleGif = library[currentSize].idle;
            display.src = currentIdleGif;
            
            // UI Updates
            statusIndicator.textContent = "Idle";
            statusIndicator.className = "absolute top-4 right-4 bg-gray-600 text-white text-xs px-3 py-1 rounded-full opacity-50";
        }

        // Triggers a specific action
        function triggerAction(actionData) {
            // 1. Clear any existing timer (in case you double-click or interrupt an action)
            if (actionTimeout) {
                clearTimeout(actionTimeout);
            }

            // 2. Change Visual
            display.src = actionData.visual;

            // 3. Play Audio (if any)
            if (actionData.audio) {
                audioPlayer.src = actionData.audio;
                audioPlayer.play().catch(e => console.log("Audio play blocked or file missing: ", e));
            }

            // 4. Update UI Status
            statusIndicator.textContent = `Playing: ${actionData.label}`;
            statusIndicator.className = "absolute top-4 right-4 bg-blue-600 text-white text-xs px-3 py-1 rounded-full shadow-lg shadow-blue-500/50";

            // 5. Set timer to return to idle after the specific GIF duration
            actionTimeout = setTimeout(() => {
                setIdleState();
            }, actionData.duration);
        }

        // Renders the specific buttons for the chosen audience size
        function renderButtons() {
            buttonContainer.innerHTML = ''; // Clear current buttons
            const actions = library[currentSize].actions;

            actions.forEach(action => {
                const btn = document.createElement('button');
                btn.className = "bg-gray-700 hover:bg-blue-600 text-white font-semibold py-3 px-4 rounded transition-colors active:scale-95 flex flex-col items-center justify-center text-center";
                
                // You can add icons here based on the action label
                btn.innerHTML = `
                    <span class="text-sm">${action.label}</span>
                    <span class="text-xs text-gray-400 font-normal mt-1">${(action.duration / 1000).toFixed(1)}s</span>
                `;
                
                btn.onclick = () => triggerAction(action);
                buttonContainer.appendChild(btn);
            });
        }

        // --- 5. EVENT LISTENERS & INITIALIZATION ---

        // When the user changes the dropdown size
        sizeSelector.addEventListener('change', (e) => {
            currentSize = e.target.value;
            
            // Interrupt any currently playing action and reset to the new size's idle
            if (actionTimeout) clearTimeout(actionTimeout);
            setIdleState();
            renderButtons();
        });

        // Initialize the app on page load
        function init() {
            renderButtons();
            setIdleState();
        }

        init();
    </script>
</body>
</html>
