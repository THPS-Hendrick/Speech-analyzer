This document serves as the **Source of Truth** for the THPS coaching system, detailing the cognitive, biological, and structural frameworks behind elite public speaking and the *Vocal Mechanics Method*.

---

## Part 1: Performance Margins & Diagnostics

Public speaking proficiency is determined by measurable biomechanical ranges rather than rigid scripts. The table below represents the core clinical diagnostic metrics:

| Metric Category | Target Safe Margin | Red Zone Deviation | Coaching Intervention |
| :--- | :--- | :--- | :--- |
| **Delivery Pace** | 100 – 155 WPM | > 175 WPM (Rambling) | Slow cadence, Count framework |
| **Pause Ratio** | 15% – 35% of runtime | < 10% (Zero breath) | Inject structural comma stops |
| **Personal Content** | 30% – 60% vivid examples | < 15% (Pure abstract) | Worked analogies (e.g. Uber Eats) |
| **SNR (Signal/Noise)** | High information density | Low density + filler | Repeat & Count formula |

> **Biomechanical Reality:** Dr. Greg Rose of the Titleist Performance Institute notes there are a million good ways to swing a golf club, but the *only sustainable swing* is the one that respects your specific body's mechanics. Public speaking is identical.

---

## Part 2: Cognitive Load & The Juggler Analogy

Public speaking is the mechanical execution of concurrent rules. Proficiency is governed by cognitive bandwidth:

1. **Topic Constraint:** The core prompt (e.g., *"Would you invest in a bakery?"*)
2. **Structural Pattern:** Inside/Outside or Small/Big Count Framework
3. **Repetitive Anchors:** Injecting purposeful phrase pacing
4. **Vocal Variance:** Modulation of volume, inflection, and pitch

### Code & Technical Infrastructure Example

The algorithmic scoring in the **Mic-Check Diagnostics App** maps directly to these rules:

\`\`\`javascript
function calculateSNR(wordsPerMinute, pausePercentage, personalRatio) {
  const isPaceSafe = wordsPerMinute >= 100 && wordsPerMinute <= 155;
  const isPauseSafe = pausePercentage >= 0.15 && pausePercentage <= 0.35;
  const isPersonalContentSafe = personalRatio >= 0.30;
  
  // Return boolean status and diagnostic score
  return {
    autonomousPhase: isPaceSafe && isPauseSafe && isPersonalContentSafe,
    threatLevel: isPaceSafe ? "GREEN_ZONE" : "YELLOW_OVERRIDE"
  };
}
\`\`\`

---

## Part 3: The Repeat, Count, Example Framework

When delivering unscripted presentations under intense social pressure, execute this operational sequence:

* **Step 1 (The Repeat):** Deliberately repeat or clarify the prompt immediately (*"The question is whether to invest..."*).
* **Step 2 (The Count):** Declare a structural container upfront (*"There are two ways to look at this: inside vs outside..."*).
* **Step 3 (The Example):** Populate the container with vivid sensory metadata or relatable concepts.

This system guarantees **signal boosting**, prevents prefrontal cortex overload, and eliminates nervous hesitation.`;

    // Configure Marked.js for GFM tables and code blocks
    marked.setOptions({
      gfm: true,
      breaks: false,
      headerIds: true,
      mangle: false,
      highlight: function(code, lang) {
        if (lang && hljs.getLanguage(lang)) {
          try {
            return hljs.highlight(code, { language: lang }).value;
          } catch (__) {}
        }
        return hljs.highlightAuto(code).value;
      }
    });

    // Helper: Toast Notification
    function showToast(message, isError = false) {
      toastMessage.textContent = message;
      toast.classList.remove('translate-y-20', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');
      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 3000);

    // Render Markdown to Preview
    function renderMarkdown() {
      const text = mdInput.value;
      
      // Update statistics
      const words = text.trim() ? text.trim().split(/\s+/).length : 0;
      const chars = text.length;
      statWords.textContent = `${words.toLocaleString()} words`;
      statChars.textContent = `${chars.toLocaleString()} characters`;

      // Convert Markdown to HTML
      try {
        const rawHtml = marked.parse(text);
        pdfDoc.innerHTML = rawHtml;
      } catch (err) {
        console.error("Markdown parse error:", err);
        pdfDoc.innerHTML = `<div class="p-4 text-red-600 bg-red-50 border border-red-200 rounded">Error parsing Markdown: ${err.message}</div>`;
      }
      
      // Re-trigger icon creation if needed
      lucide.createIcons();
    }

    // Update Layout Styles & Paper Dimensions
    function updatePaperStyles() {
      const paper = selectPaper.value;
      const margin = selectMargin.value;
      const orientation = selectOrientation.value;

      // Base sizes in mm
      let width = paper === 'a4' ? 210 : 215.9; // mm
      let minHeight = paper === 'a4' ? 297 : 279.4; // mm

      if (orientation === 'landscape') {
        const temp = width;
        width = minHeight;
        minHeight = temp;
      }

      // Apply dimensions & padding
      pdfDoc.style.maxWidth = `${width}mm`;
      pdfDoc.style.padding = `${margin}mm`;
      pdfDoc.style.minHeight = `${minHeight}mm`;

      // Apply theme class
      pdfDoc.className = `${selectTheme.value} bg-white shadow-lg mx-auto rounded-sm border border-slate-200 transition-all`;
    }

    // Load Sample Content
    function loadSample() {
      mdInput.value = SAMPLE_MARKDOWN;
      activeFilename.textContent = "sample_document.md";
      renderMarkdown();
      showToast("Sample loaded successfully");
    }

    // Clear Workspace
    function clearContent() {
      mdInput.value = "";
      activeFilename.textContent = "untitled.md";
      renderMarkdown();
      showToast("Editor cleared");
    }

    // Read and Load File
    function handleFile(file) {
      if (!file) return;
      if (!file.name.match(/\.(md|markdown|txt)$/i)) {
        showToast("Please upload a .md or .txt file", true);
        return;
      }
      const reader = new FileReader();
      reader.onload = function(e) {
        mdInput.value = e.target.result;
        activeFilename.textContent = file.name;
        renderMarkdown();
        showToast(`Loaded ${file.name}`);
      };
      reader.readAsText(file);
    }

    // Copy Raw Markdown
    btnCopyMd.addEventListener('click', () => {
      const text = mdInput.value;
      if (!text) return;
      
      // Clipboard copy compatible with iframes
      const tempTextArea = document.createElement("textarea");
      tempTextArea.value = text;
      document.body.appendChild(tempTextArea);
      tempTextArea.select();
      try {
        document.execCommand('copy');
        showToast("Markdown copied to clipboard");
      } catch (err) {
        showToast("Failed to copy", true);
      }
      document.body.removeChild(tempTextArea);
    });

    // File input event
    fileUpload.addEventListener('change', (e) => {
      handleFile(e.target.files[0]);
    });

    // Drag and Drop handlers
    window.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropOverlay.classList.remove('hidden');
    });

    window.addEventListener('dragleave', (e) => {
      if (e.clientX <= 0 || e.clientY <= 0) {
        dropOverlay.classList.add('hidden');
      }
    });

    window.addEventListener('drop', (e) => {
      e.preventDefault();
      dropOverlay.classList.add('hidden');
      if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        handleFile(e.dataTransfer.files[0]);
      }
    });

    // Interactive event listeners
    mdInput.addEventListener('input', renderMarkdown);
    btnLoadSample.addEventListener('click', loadSample);
    btnClear.addEventListener('click', clearContent);

    selectTheme.addEventListener('change', updatePaperStyles);
    selectPaper.addEventListener('change', updatePaperStyles);
    selectMargin.addEventListener('change', updatePaperStyles);
    selectOrientation.addEventListener('change', updatePaperStyles);

    // Browser Print Dialog
    btnBrowserPrint.addEventListener('click', () => {
      window.print();
    });

    // Export PDF via html2pdf
    btnExportPdf.addEventListener('click', () => {
      const element = document.getElementById('pdf-rendered-document');
      const filename = activeFilename.textContent.replace(/\.[^/.]+$/, "") + ".pdf";
      const paper = selectPaper.value;
      const orientation = selectOrientation.value;
      const marginVal = parseInt(selectMargin.value, 10);

      btnExportPdf.disabled = true;
      btnExportPdf.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>Generating...</span>`;
      lucide.createIcons();

      const opt = {
        margin: [marginVal, marginVal, marginVal, marginVal],
        filename: filename || 'document.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true, logging: false },
        jsPDF: { 
          unit: 'mm', 
          format: paper, 
          orientation: orientation 
        },
        pagebreak: { 
          mode: ['avoid-all', 'css', 'legacy'] 
        }
      };

      // Create a temporary clone for rendering without excessive container padding
      const clone = element.cloneNode(true);
      clone.style.padding = '0';
      clone.style.margin = '0';
      clone.style.boxShadow = 'none';
      clone.style.border = 'none';
      clone.style.minHeight = 'auto';

      html2pdf().set(opt).from(clone).save()
        .then(() => {
          showToast("PDF exported successfully!");
        })
        .catch((err) => {
          console.error("PDF generation failed:", err);
          showToast("Error generating PDF", true);
        })
        .finally(() => {
          btnExportPdf.disabled = false;
          btnExportPdf.innerHTML = `<i data-lucide="download" class="w-4 h-4"></i><span>Export PDF</span>`;
          lucide.createIcons();
        });
    });

    // Initial setup on window load
    window.onload = function() {
      loadSample();
      updatePaperStyles();
    };
  </script>
</body>
</html>
