name: Auto-generate Website Context Blueprint

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'

jobs:
  build-context:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Context Blueprint
        run: node generate-context.js

      - name: Commit and Push Updated Blueprint
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add website-context.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: auto-update website-context.md blueprint" && git push)
